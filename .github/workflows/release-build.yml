name: Release & Beta Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.0-beta)'
        required: false
        default: '1.0.0'

jobs:
  build-release:
    name: Build Beta Release (AAB & APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore (Base64)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.jks
          echo "KEYSTORE_PATH=/tmp/keystore/release.jks" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Release Bundle (AAB for Google Play) & APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew clean bundleRelease assembleRelease --stacktrace

      - name: Upload Release AAB (Google Play Beta)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCity-Beta-Bundle-v${{ github.ref_name || inputs.version_name }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCity-Beta-APK-v${{ github.ref_name || inputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: true
          name: Arrow City Beta ${{ github.ref_name }}
          body: |
            ### Arrow City Beta ${{ github.ref_name }} Release
            - **Application ID**: `com.mitsara.arrowcity`
            - **Status**: Beta Early Access (v1.0.0)
            - **Monetization**: 100% Free Store for all Early Access testers
            - **Privacy**: No Ads, No Sign-In, 100% Offline Capable
